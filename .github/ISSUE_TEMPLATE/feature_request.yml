name: Feature request
description: Suggest a capability Parquity does not have
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: What are you trying to do
      description: >
        The problem, before the solution. What are you testing, and what stops
        you today?
    validations:
      required: true

  - type: textarea
    attributes:
      label: What you would like to happen

  - type: textarea
    attributes:
      label: Alternatives you have considered
      description: >
        Including doing it outside Parquity. If a workaround exists, say what it
        costs you.

  - type: textarea
    attributes:
      label: Anything else
